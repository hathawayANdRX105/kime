# canon 体系性能配置（rust-dev-perf skill）

# ── canon 体系性能配置（rust-dev-perf skill）────────────────────
[build]
# 多会话并发上限：每个 cargo 进程最多 4 个并行编译单元
jobs = 4
# sccache 跨 worktree 编译缓存
# （勿用 [env] RUSTC_WRAPPER：cargo 启动时自读该变量，[env] 够不着）
rustc-wrapper = "sccache"

# xtask 工作区入口（xtask/ 独立 workspace）。成员仓检查走
# `cargo xtask check <list|check|explain>`；将来加别的 xtask 成员时，
# 在此追加一条 `xtask-<成员> = "run -q --manifest-path xtask/Cargo.toml -p <成员> --"`。
[alias]
xtask = "run -q --manifest-path xtask/Cargo.toml -p xtask-check --"
