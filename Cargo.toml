[workspace]
resolver = "2"
members = [
    "crates/kime-pinyin",
    "crates/kime-shuangpin",
    "crates/kime-core",
    "crates/kime-render",
    "bin/kime",
    "crates/platform-wayland",
    "crates/platform-x11",
]

[workspace.package]
version = "0.23.87"
edition = "2021"

# dylint 的 lint 名只在 dylint 运行时注册，且 dylint 用 `--cfg=dylint_lib="<库名>"`
# 传递「当前加载的是哪个 lint 库」。rustc 的 check-cfg 不认识这个 cfg 名，
# 会报 unexpected_cfgs（-D warnings 下直接失败）。这里按 dylint 官方文档声明
# 该 cfg 的合法取值集合，成员 crate 通过 [lints] workspace = true 继承。
[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(dylint_lib, values(any()))"]

[[bench]]
name = "kime_bench"
path = "benches/kime_bench.rs"
harness = false

[package]
name = "kime-root"
version.workspace = true
edition.workspace = true

[dependencies]
kime-core = { path = "crates/kime-core" }

[profile.release]
# 速度优先：fat LTO + 单 codegen unit，换最大跨 crate 内联
lto = "fat"
codegen-units = 1
# 去符号表；二进制本身会被 UPX 再压
strip = true

# 日常试用直接跑 target/debug 的话，依赖也按 O2 编译，
# 首次全量编译变慢一次，之后增量编译不受影响
[profile.dev.package."*"]
opt-level = 2

# 开发/测试构建降 debuginfo + 关增量（sccache 缓存优先，取舍见 rust-dev-perf skill）
[profile.dev]
debug = "line-tables-only"
incremental = false

# 继承 workspace 的 lint 配置（check-cfg 声明 dylint_lib 这个 cfg 名）
[lints]
workspace = true
