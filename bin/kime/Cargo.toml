[package]
name = "kime"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kime"
path = "src/main.rs"

[dependencies]
kime-core = { path = "../../crates/kime-core" }
kime-shuangpin = { path = "../../crates/kime-shuangpin" }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

# 继承 workspace 的 lint 配置（check-cfg 声明 dylint_lib 这个 cfg 名）
[lints]
workspace = true
