# CHECKS-DETERMINISTIC: canon 规则库（check-rust / check-deps）成员仓入口
# 为什么: D9 迁移——规则由 Rust 规则 crate 执行，经 canon 引擎统一
#   severity/拦截/处置。规则目录:
#   `cargo run -q --manifest-path checks/Cargo.toml -- explain <id>`
# 范围: changed 口径（GATE_BASE 回落 origin/main）——只判本次改动文件。
#   全仓审计手动跑：把 --scope changed 换成 --scope all。
# 不挂 pre-commit（首次冷编成本）；pre-push 等预构建产物落地再加。
# notChecked: semantic 端点（laya）不可用时由 CHECKS-NOTCHECKED INFO 表达，
#   绝不做 candidates-raw 假绿。
hooks: [merge]
sla: l1
fail_severity: WARN              # 起步 WARN，观察一周期后按实据升 FAIL
match:
  paths_include: ["**/*.rs", "**/Cargo.toml"]
  paths_exclude: ["target/", ".wt/"]
mode: grep
harness:
  command: "sh"
  args:
    - "-c"
    - |
      ROOT=$(git rev-parse --show-toplevel)
      cd "$ROOT" || exit 2
      BASE="${GATE_BASE:-origin/main}"
      cargo run -q --manifest-path checks/Cargo.toml -- check --root "$ROOT" \
        --scope changed --base "$BASE" --class deterministic --class advisory --canon --json
optional: true # 依赖/工具缺失 → WARN 跳过，不假绿
timeout: 600
