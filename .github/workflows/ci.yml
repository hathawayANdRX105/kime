# kime CI
#
# 项目策略：所有测试只在 CI 跑，本地只做轻量验证（cargo check / fmt --check）。
# 本地重命令必须套 cpulimit -l 65 -i --（见 AGENTS.md）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps (wayland / xkbcommon / fontconfig / xcb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libxcb1-dev \
            pkg-config
      # .cargo/config.toml 配了 rustc-wrapper = sccache，runner 上没装会直接失败
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (wayland / xkbcommon / fontconfig / xcb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libxcb1-dev \
            pkg-config
      # .cargo/config.toml 配了 rustc-wrapper = sccache，runner 上没装会直接失败
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        # 全部测试均为离线（xkb 文本直喂、内存字典），无需 Wayland/X 显示。
        run: cargo test --workspace --all-targets

  # 本地更新通道：编译 release 二进制并作为 artifact 下载（不发布 release，
  # 不打 tag）。验证未稳定的改动时，本地二进制走这里更新。
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (wayland / xkbcommon / fontconfig / xcb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libxcb1-dev \
            pkg-config
      # .cargo/config.toml 配了 rustc-wrapper = sccache，runner 上没装会直接失败
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p kime -p platform-wayland -p platform-x11
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: kime-binaries
          path: |
            target/release/kime
            target/release/platform-wayland
            target/release/platform-x11
          if-no-files-found: error
          retention-days: 14

  rust-specs-dylint:
    name: rust-specs dylint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout rust-specs
        uses: actions/checkout@v4
        with:
          repository: hathawayANdRX105/rust-specs
          ref: main
          path: rust-specs
      - name: Move rust-specs outside kime workspace
        run: mv "$GITHUB_WORKSPACE/rust-specs" "$RUNNER_TEMP/rust-specs"
      - name: Install pinned nightly + rustc-dev + llvm-tools-preview
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustc-dev --component llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-dylint + dylint-link (isolated, off the kime workspace)
        run: |
          set -euo pipefail
          DINST="$RUNNER_TEMP/dylint-install"
          mkdir -p "$DINST"
          printf '[package]\nname = "dylint-installer"\nversion = "0.0.0"\nedition = "2021"\n' > "$DINST/Cargo.toml"
          cargo +nightly-2026-08-20 install \
            --root "$DINST/root" \
            --version 6.3.0 \
            cargo-dylint dylint-link
          echo "$DINST/root/bin" >> "$GITHUB_PATH"
      - name: Compile adopted lint dylibs
        run: |
          set -euo pipefail
          RS="$RUNNER_TEMP/rust-specs"
          # dylib 必须由 dylint-link 链接（产物名 lib<name>@<toolchain>.so，
          # cargo dylint --lib-path 只认这个形式）。rust-specs 各 lint 目录的
          # .cargo/config.toml 配了同款 linker，但从 kime 仓库根以
          # --manifest-path 构建时 cargo 按 cwd 发现 config，取不到 lint
          # 目录的配置而回落 cc，这里用环境变量补齐（同效果，全局生效）。
          export RUSTFLAGS="-C linker=dylint-link"
          RUSTC_BOOTSTRAP=1 cargo +nightly-2026-08-20 build --release \
            --manifest-path "$RS/Cargo.toml" \
            -p ban_unwrap -p chainable_single_statement -p consecutive_same_shape_loops \
            -p early_return_needs_no_else -p expect_in_non_result -p let_if_else \
            -p max_nesting_depth -p redundant_branch_closures -p test_placement
      - name: Run dylint
        run: |
          set -euo pipefail
          RS="$RUNNER_TEMP/rust-specs"
          LINT_DIR="$RS/target/release"
          # 分级：
          # -D 阻断（语义类，本 PR 已清零）：ban_unwrap / expect_in_non_result
          # -W 报告（风格/重构类，存量待独立任务收敛）：其余
          #   ——rust-specs 侧这些 lint 的默认级别本就是 Warn，只有项目显式 -D
          #   才升级为错误；批量改写会污染本 PR 的主题。
          BLOCK_LINTS="ban_unwrap expect_in_non_result"
          REPORT_LINTS="chainable_single_statement consecutive_same_shape_loops early_return_needs_no_else let_if_else max_nesting_depth redundant_branch_closures test_placement"
          ALL_LINTS="$BLOCK_LINTS $REPORT_LINTS"
          # --lib-path 每次收一个 dylib 文件（dylint 6.3 逐个 canonicalize 后
          # 校验文件名须为 lib<name>@<toolchain>.so），不能传目录。
          LIB_PATHS=""
          LINT_FLAGS=""
          for name in $ALL_LINTS; do
            so=$(ls "$LINT_DIR/lib${name}@"*.so)
            LIB_PATHS="$LIB_PATHS --lib-path $so"
            case " $BLOCK_LINTS " in
              *" $name "*) LINT_FLAGS="$LINT_FLAGS -D $name" ;;
              *) LINT_FLAGS="$LINT_FLAGS -W $name" ;;
            esac
          done
          set +e
          DYLINT_RUSTFLAGS="$LINT_FLAGS" cargo +nightly-2026-08-20 dylint \
            --no-deps --workspace $LIB_PATHS > /tmp/dylint.all 2>&1
          code=$?
          set -e
          # rustc 输出带 ANSI 颜色（CARGO_TERM_COLOR=always），先剥色再统计，
          # 否则锚点 grep 全部落空、finding 清单为空（假绿）。
          sed -r 's/\x1B\[[0-9;]*[mGK]//g' /tmp/dylint.all > /tmp/dylint.plain
          echo "== dylint exit: $code =="
          echo "== dylint.plain size (bytes) =="
          wc -c < /tmp/dylint.plain
          echo "== finding count by lint =="
          grep -oE '`-[A-Z] [a-z_-]+`' /tmp/dylint.plain | sort | uniq -c || true
          echo "== finding messages =="
          grep -E '^(warning|error): ' /tmp/dylint.plain | sort | uniq -c || true
          echo "== findings with lint and location =="
          # 每条诊断块形如：warning: <msg> / --> <file:line> / note: ... with `-W <lint>`
          # 聚合统计会把消息与位置配对丢掉，这里按块输出三行一组。
          awk '
            /^(warning|error): / && !/generated [0-9]+ warnings/ { msg=$0; sub(/^(warning|error): /,"",msg); loc=""; lint="" }
            /--> crates\// { if (msg != "" && loc == "") { loc=$0; sub(/^.*--> /,"",loc) } }
            /requested on the command line with/ {
              if (msg != "") {
                lint=$0; sub(/^.*with `/,"",lint); sub(/`.*/,"",lint);
                printf "%s | %s | %s\n", lint, loc, msg;
              }
            }
          ' /tmp/dylint.plain | sort | uniq -c
          # -D 级 lint 有 finding 即失败；-W 级只报告。
          if [ "$code" -ne 0 ]; then
            echo "dylint failed with exit $code"
            grep -E '^(error|warning): ' /tmp/dylint.plain | head -40 || true
            exit 1
          fi

  perf:
    name: Benchmark (synthetic dict)
    runs-on: ubuntu-latest
    continue-on-error: true # 基线记录用途，不阻塞合入；噪音由同 runner 对比消除
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # .cargo/config.toml 配了 rustc-wrapper = sccache，runner 上没装会直接失败
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - uses: Swatinem/rust-cache@v2
      - name: Generate synthetic dict (100k unique pinyin/text pairs)
        run: |
          python3 - <<'EOF'
          import itertools, pathlib
          syls = ["a","ai","an","ang","ao","ba","bai","ban","bang","bao","bei","ben","beng","bi","bian","biao","bie","bin","bing","bo","bu","ca","cai","can","cang","cao","ce","cen","ceng","cha","chai","chan","chang","chao","che","chen","cheng","chi","chong","chou","chu","chua","chuai","chuan","chuang","chui","chun","chuo","ci","cong","cou","cu","cuan","cui","cun","cuo","da","dai","dan","dang","dao","de","den","deng","di","dia","dian","diao","die","ding","diu","dong","dou","du","duan","dui","dun","duo","e","en","er","fa","fan","fang","fei","fen","feng","fo","fou","fu","ga","gai","gan","gang","gao","ge","gen","geng","gong","gou","gu","gua","guai","guan","guang","gui","gun","guo","ha","hai","han","hang","hao","he","hei","hen","heng","hong","hou","hu","hua","huai","huan","huang","hui","hun","huo","ji","jia","jian","jiang","jiao","jie","jin","jing","jiong","jiu","ju","juan","jue","jun","ka","kai","kan","kang","kao","ke","ken","keng","kong","kou","ku","kua","kuai","kuan","kuang","kui","kun","kuo","la","lai","lan","lang","lao","le","lei","leng","li","lia","lian","liang","liao","lie","lin","ling","liu","lo","long","lou","lu","luan","lun","luo","ma","mai","man","mang","mao","me","mei","men","meng","mi","mian","miao","mie","min","ming","miu","mo","mou","mu","na","nai","nan","nang","nao","ne","nei","nen","neng","ni","nian","niang","niao","nie","nin","ning","niu","nong","nou","nu","nuan","nuo","o","ou","pa","pai","pan","pang","pao","pei","pen","peng","pi","pian","piao","pie","pin","ping","po","pou","pu","qi","qia","qian","qiang","qiao","qie","qin","qing","qiong","qiu","qu","quan","que","qun","ran","rang","rao","re","ren","reng","ri","rong","rou","ru","rua","ruan","rui","run","ruo","sa","sai","san","sang","sao","se","sen","seng","sha","shai","shan","shang","shao","she","shei","shen","sheng","shi","shou","shu","shua","shuai","shuan","shuang","shui","shun","shuo","si","song","sou","su","suan","sui","sun","suo","ta","tai","tan","tang","tao","te","teng","ti","tian","tiao","tie","ting","tong","tou","tu","tuan","tui","tun","tuo","wa","wai","wan","wang","wei","wen","weng","wo","wu","xi","xia","xian","xiang","xiao","xie","xin","xing","xiong","xiu","xu","xuan","xue","xun","ya","yan","yang","yao","ye","yi","yin","ying","yo","yong","you","yu","yuan","yue","yun","za","zai","zan","zang","zao","ze","zei","zen","zeng","zha","zhai","zhan","zhang","zhao","zhe","zhen","zheng","zhi","zhong","zhou","zhu","zhua","zhuai","zhuan","zhuang","zhui","zhun","zhuo","zi","zong","zou","zu","zuan","zui","zun","zuo"]
          chars = [chr(c) for c in range(0x4E00, 0x4E00 + 3000)]
          freq = 1000000
          with open("/tmp/gen.yaml", "w") as f:
              f.write("...\n")
              n = 0
              for s1, s2 in itertools.product(syls, syls):
                  if n >= 100_000:
                      break
                  w = chars[n % 3000] + chars[(n * 7 + 3) % 3000]
                  f.write(f"{w}\t{s1} {s2}\t{freq - n}\n")
                  n += 1
          print(f"generated {n} entries")
          EOF
      - name: Import + build FST
        run: |
          cargo run -q -p kime -- --dict /tmp/gen.sqlite --import /tmp/gen.yaml
          cargo run -q -p kime -- build-dict --in /tmp/gen.sqlite --out /tmp/kime_dict.bin
      - name: Run benchmark
        run: |
          KIME_BENCH_DB=/tmp/gen.sqlite KIME_BENCH_BIN=/tmp/kime_dict.bin \
            cargo bench -q --bench kime_bench 2>&1 | tee /tmp/bench_out.txt
      - name: Report
        if: always()
        run: |
          echo '### Benchmark（合成 10 万词库；跨 runner 噪音大，同 job 前后对比才有效）' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/bench_out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
