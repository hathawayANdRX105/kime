name: release

on:
  push:
    tags: ["v*"]
  # 允许手动触发调试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # platform-x11 需要 libxcb；platform-wayland 的 xkb 解码测试需要 libxkbcommon
      - run: sudo apt-get update -qq && sudo apt-get install -y libxcb1-dev libxkbcommon-dev

      # 单测全量跑一遍，哑火就别发 release
      - run: cargo test --workspace

      # release profile 已在 Cargo.toml 固定：fat LTO + 单 codegen-unit + strip
      # workspace 根是 kime-root 包,必须显式 --workspace 否则只编根包
      - run: cargo build --release --workspace --locked

      # UPX 进一步压缩体积（lzma 算法压得更狠但加载略慢，这里取默认）
      - run: |
          upx --best --lzma target/release/kime target/release/platform-wayland target/release/platform-x11

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/kime target/release/platform-wayland target/release/platform-x11 dist/
          tar -C dist -czf "kime-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" kime platform-wayland platform-x11
          cd dist && sha256sum kime platform-wayland platform-x11 > SHA256SUMS.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "kime ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/kime
            dist/platform-wayland
            dist/platform-x11
            dist/SHA256SUMS.txt
            kime-*-linux-x86_64.tar.gz

      # generate_release_notes 会在每条 PR 后追加「by @作者 in #N」；
      # 个人仓库没有意义，重写 body 剥掉这段尾巴。
      - name: Strip author attribution from release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # action-gh-release 刚建完 release，releases/tags 端点传播有数百 ms 延迟，重试到读得到为止
          REL_ID=""
          for i in $(seq 1 10); do
            if REL_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id 2>/dev/null) && [ -n "$REL_ID" ]; then break; fi
            echo "release 还没传播，重试 $i/10"; sleep 2
          done
          test -n "$REL_ID" || { echo "读不到 release id"; exit 1; }
          # PATCH /releases/{release_id} 只吃数字 id，tag name 会 404
          gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID" --jq .body > body.md
          sed -E 's; by @[-A-Za-z0-9_]+ in (#[0-9]+|https://[^ )]+);;g' body.md > body_clean.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$REL_ID" -F body=@body_clean.md --jq .name
