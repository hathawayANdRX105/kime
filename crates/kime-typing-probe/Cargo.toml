[package]
name = "kime-typing-probe"
version.workspace = true
edition.workspace = true

[dependencies]
kime-core = { path = "../kime-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[features]
default = []
# 启用后才编译 reqwest 并允许 LLM HTTP 请求；默认关闭，CI 完全离线。
llm = ["dep:reqwest"]

[dependencies.reqwest]
version = "0.12"
features = ["json", "blocking", "rustls-tls"]
optional = true

[lints]
workspace = true
