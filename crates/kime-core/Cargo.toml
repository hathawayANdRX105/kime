[package]
name = "kime-core"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
kime-pinyin = { path = "../kime-pinyin" }
kime-shuangpin = { path = "../kime-shuangpin" }
fst = "0.4.7"
memmap2 = "0.9"
anyhow = "1.0.104"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"