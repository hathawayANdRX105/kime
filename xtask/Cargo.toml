# xtask 工作区：kime 的开发辅助命令集中地。
#
# 每个子目录是一个独立 crate（二进制），用 `cargo xtask <名字> …` 调用
# （alias 见 .cargo/config.toml，指向本工作区）。check 子命令走 canon 规则库
# 门禁。
#
# 本工作区刻意不进 kime 根 workspace：xtask 有自己的依赖节奏（canon 规则库按
# tag 升级），独立 lock 让 `cargo build --workspace` 不牵动它。

[workspace]
resolver = "2"
members = ["check"]
